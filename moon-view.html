<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>月相觀測模擬器 · Moon View Simulator</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05070e; --card:#0f1523; --card2:#141b2c; --inp:#0b1120;
  --line:#22304a; --line2:#2e3f5e; --txt:#e8eefb; --dim:#9cabc6; --dim2:#7d8daf;
  --A:#45d9e8; --Ad:#0d3a46; --B:#ffb35c; --Bd:#46320f; --acc:#8aa8ff;
  --r:11px; --sh:0 5px 18px rgba(0,0,0,.42);
  --moonw:240px; --drawerh:0px;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:radial-gradient(1200px 700px at 80% -10%,#15214a 0%,rgba(8,11,22,0) 62%),
             radial-gradient(900px 520px at 4% 108%,#0f2738 0%,rgba(8,11,22,0) 60%),var(--bg);
  color:var(--txt);
  font:13.5px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
#shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* ---------- header ---------- */
header#top{flex:0 0 auto;display:flex;align-items:center;gap:9px;padding:5px 10px 5px;min-width:0}
.logo{width:26px;height:26px;flex:0 0 26px;border-radius:50%;
  background:radial-gradient(circle at 34% 32%,#f4f1e6,#b9b4a4 55%,#6d6a60 100%);
  box-shadow:0 0 16px rgba(220,225,255,.26),inset -5px -3px 9px rgba(0,0,0,.45)}
h1{font-size:clamp(13px,2vw,16px);margin:0;font-weight:650;letter-spacing:.2px;white-space:nowrap;flex:0 0 auto}
.hrow{display:flex;align-items:baseline;gap:8px;min-width:0}
.sub{margin:0;font-size:10.5px;color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.hgrow{flex:1 1 auto;min-width:0}
.topbtns{display:flex;gap:5px;flex:0 0 auto}

/* ---------- generic ---------- */
.btn{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;transition:.13s;white-space:nowrap}
.btn:hover{background:#1d2740;border-color:var(--line2)}
.btn:active{transform:translateY(1px)}
.btn.sm{padding:4px 8px;font-size:11px;border-radius:7px}
.btn.on{background:linear-gradient(180deg,#2a3f6b,#1d2c4e);border-color:#3f5c95;color:#dce7ff}
.btn.tA.on{background:linear-gradient(180deg,#0f4b5a,#0b3743);border-color:#1d7f95;color:#b9f4ff}
.btn.tB.on{background:linear-gradient(180deg,#5c4113,#3d2b0c);border-color:#96701f;color:#ffe2b3}
.card{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,0)),var(--card);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
input,select{background:var(--inp);color:var(--txt);border:1px solid var(--line);border-radius:7px;
  padding:5px 6px;font:inherit;font-size:12px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
select{appearance:none;-webkit-appearance:none;padding-right:15px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238b9bb8' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 4px center;background-size:8px 5px}
input:focus,select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(138,168,255,.16)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
label.mini{display:block;font-size:9px;color:var(--dim2);margin:0 0 2px 1px;letter-spacing:.2px;text-align:center}
canvas{display:block;touch-action:none}
[hidden]{display:none!important}
.grow{flex:1 1 auto;min-width:0}

/* ---------- main grid : PORTRAIT (base) ---------- */
#main{flex:1 1 auto;min-height:0;display:grid;gap:8px;padding:0 8px 8px;
  grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
#side{grid-row:1;min-height:0;display:flex;flex-direction:column;gap:8px}
#gpane{grid-row:2;min-height:200px}
#units{display:grid;gap:8px;grid-template-columns:1fr 1fr;align-items:stretch}

/* ---------- main grid : LANDSCAPE ---------- */
@media (min-aspect-ratio:11/10){
  #main{grid-template-columns:minmax(0,1fr) clamp(320px,30vw,432px);grid-template-rows:minmax(0,1fr)}
  #side{grid-row:1;grid-column:2;overflow-y:auto;overflow-x:hidden;padding-right:2px}
  #gpane{grid-row:1;grid-column:1}
  #units{grid-template-columns:1fr}
}

/* ---------- time card ---------- */
.trow{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-top:4px}
.tgrid{flex:1 1 0;min-width:0;display:flex;flex-wrap:wrap;gap:4px}
.tg3{flex:1 1 112px;min-width:0;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:4px}
.tg3+.tg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tg3>div{display:flex;align-items:center;gap:2px;min-width:0}
.tgrid input{flex:1 1 0;min-width:0;padding:4px 1px;font-size:11.5px;text-align:center}
.tgrid label.mini{flex:0 0 auto;display:block;margin:0;font-size:9px}
/* 同 A 核取方塊：與時間格同列，方塊在前、標籤在後 */
.swt.sync1{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:3px;cursor:pointer;user-select:none}
.sync1 .mini{display:block;font-size:9px;color:var(--dim2);margin:0;white-space:nowrap}
.sync1 .cbw{display:grid;place-items:center;padding:0}
.sync1 input{width:auto;margin:0;padding:0;accent-color:var(--acc);cursor:pointer}
/* 卡片窄到時間欄位會折成兩列時，標籤改放到方塊上方 */
@container (max-width:280px){
  .swt.sync1{flex-direction:column-reverse;gap:0;align-self:center}
  .sync1 .mini{margin:0 0 1px;font-size:8.5px}
}
.ghost{visibility:hidden;pointer-events:none}
.ghost .cbx{display:block;width:13px;height:13px}
.tgrid input:disabled{opacity:.42;cursor:not-allowed;-webkit-text-fill-color:var(--txt)}
.btn:disabled,select:disabled{opacity:.42;cursor:not-allowed}
.trow.frozen .tgrid label.mini{opacity:.5}
.tzsel{flex:1 1 auto;width:auto;min-width:0;font-size:11px;padding:4px 15px 4px 3px}
/* 直式：時區/現在/播放/速度一列，−1d 等一列；橫式：全部同列（下方覆寫） */
.qrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px;align-items:center}
.qg{display:flex;gap:4px;align-items:center;min-width:0;flex-wrap:nowrap}
.qg1,.qg2{flex:1 1 100%}
.qrow .btn{flex:1 1 auto;padding:3px 6px;font-size:10.5px;white-space:nowrap}
.qg2 .btn{flex:1 1 0;min-width:0}
#tSpeed,#tSpeedB{width:auto;flex:1 1 auto;min-width:0;font-size:11px;padding:4px 15px 4px 3px}
/* 窄卡片（手機直式）：整列緊湊一點，避免倍速被擠到下一行 */
@container (max-width:206px){
  .qrow,.qg{gap:3px}
  .qrow .btn{padding:3px 4px;font-size:10px;letter-spacing:-.2px}
  .tzsel,#tSpeed,#tSpeedB{font-size:10px;padding:4px 14px 4px 2px;background-position:right 3px center}
}
@media (min-aspect-ratio:11/10){
  .qrow,.qg{flex-wrap:nowrap;gap:3px}
  .qg1{flex:1 1 auto}
  .qg2{flex:1 1 auto;margin-left:0}
  .qrow .btn{padding:3px 5px;font-size:10px;letter-spacing:-.2px}
  .qg2 .btn{flex:1 1 0;min-width:0}
  .tgrid,.tg3{gap:3px}
}

/* ---------- unit (地點 + 月亮) ---------- */
.unit{display:flex;flex-direction:column;padding:6px 7px 0;overflow:hidden;container-type:inline-size}
.tag{font-size:10.5px;font-weight:700;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:0 0 18px}
.tagA{background:var(--Ad);color:var(--A);box-shadow:inset 0 0 0 1px rgba(69,217,232,.45)}
.tagB{background:var(--Bd);color:var(--B);box-shadow:inset 0 0 0 1px rgba(255,179,92,.45)}
.ugrow{flex:1 1 auto;min-height:6px}
.uloc{display:flex;gap:4px;flex-wrap:wrap;align-items:center;row-gap:4px}
.ug{display:flex;gap:4px;align-items:center;min-width:0}
.ugcity{flex:1 1 118px}
.ugll{flex:1 1 138px}
.uloc select{flex:1 1 0;min-width:0}
.uloc .ll{flex:1 1 0;min-width:0;text-align:center}
.uloc .gps{flex:0 0 auto;padding:4px 6px}
.uloc input{padding:4px 3px;font-size:11px}
.uloc .tag{margin-right:1px}
.swt{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);cursor:pointer;user-select:none;white-space:nowrap}
.swt input{width:auto;margin:0;accent-color:var(--acc);padding:0}
.ucanvas{position:relative;container-type:inline-size;width:var(--moonw);max-width:100%;aspect-ratio:1/1;margin:0 auto;
  background:#04060d;border-radius:9px;overflow:hidden;border:1px solid rgba(34,48,74,.8)}
.ucanvas canvas{position:absolute;inset:0;width:100%;height:100%}
.mzoom{position:absolute;right:5px;bottom:5px;display:flex;gap:3px;align-items:center;z-index:3}
.mzoom .zb{background:rgba(10,15,26,.82);border:1px solid var(--line);color:var(--dim);
  border-radius:6px;padding:1px 6px;font-size:12px;line-height:1.5;cursor:pointer;
  backdrop-filter:blur(5px);font-family:inherit}
.mzoom .zb:hover{color:var(--txt);border-color:var(--line2)}
.mzlab{font-size:9.5px;color:var(--dim2);background:rgba(10,15,26,.8);border:1px solid var(--line);
  border-radius:6px;padding:1px 5px;backdrop-filter:blur(5px);font-variant-numeric:tabular-nums}
.ucanvas canvas{cursor:crosshair}
.ucanvas.pan canvas{cursor:grab}
.mbadge{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 84px);overflow:hidden;
  text-overflow:ellipsis;font-size:10px;
  padding:2px 8px;border-radius:99px;background:rgba(6,10,18,.8);border:1px solid var(--line2);
  color:var(--dim);backdrop-filter:blur(4px);white-space:nowrap}
.mbadge.warn{color:#ffc7bd;border-color:#6b3229;background:rgba(48,14,10,.75)}
.ustats{position:absolute;left:0;right:0;top:0;z-index:3;display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  background:rgba(7,11,20,.68);backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(34,48,74,.75);border-radius:9px 9px 0 0}
@container (min-width:344px){.ustats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ustats>div{padding:3px 3px;border-right:1px solid rgba(34,48,74,.6);
  display:flex;flex-direction:row-reverse;align-items:baseline;justify-content:center;
  gap:4px;white-space:nowrap;overflow:hidden}
.ustats>div:last-child{border-right:none}
@container (max-width:343px){
  .ustats>div:nth-child(2n){border-right:none}
  .ustats>div:nth-child(-n+2){border-bottom:1px solid rgba(34,48,74,.6)}
}
.ustats b{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;
  font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.ustats span{flex:0 0 auto;font-size:9.5px;color:var(--dim2)}
@container (max-width:200px){
  .ustats>div{gap:3px;padding:3px 2px}
  .ustats b{font-size:10.5px}
  .ustats span{font-size:8.5px}
}
.mzoom .zb.mtog{padding:1px 5px}
.mzoom .zb.mtog.on{color:var(--acc);border-color:var(--acc)}

/* ---------- globe pane ---------- */
#gpane{position:relative;overflow:hidden;border-radius:var(--r);border:1px solid var(--line);
  background:#03050b;box-shadow:var(--sh)}
#globe{position:absolute;inset:0;width:100%;height:100%}
.gov{position:absolute;display:flex;gap:4px;z-index:6}
.gov.tr{top:7px;right:7px;flex-wrap:wrap;justify-content:flex-end;
  max-width:calc(100% - 14px);align-items:center}
.gov .btn{background:rgba(13,19,32,.84);backdrop-filter:blur(7px)}

/* ---------- tab bar + drawer ---------- */
#tabbar{position:absolute;left:0;right:0;bottom:0;height:32px;display:flex;gap:2px;align-items:center;
  padding:0 6px;background:rgba(7,11,20,.9);backdrop-filter:blur(9px);border-top:1px solid var(--line);z-index:8}
#tabbar .tb{background:none;border:none;color:var(--dim2);font:inherit;font-size:11.5px;
  padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
#tabbar .tb:hover{color:var(--txt)}
#tabbar .tb.on{background:#1b2540;color:#cfe0ff}
#gInfo{font-size:9.5px;color:var(--dim2);font-variant-numeric:tabular-nums;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;padding-right:2px}
#drawer{position:absolute;left:0;right:0;bottom:32px;height:0;overflow:hidden;z-index:7;
  background:rgba(8,12,21,.955);backdrop-filter:blur(11px);border-top:1px solid var(--line);
  transition:height .2s ease}
/* 直式：抽屜改為覆蓋式底部面板，地球不被壓縮 */
@media (max-aspect-ratio:11/10){
  #drawer{position:fixed;left:8px;right:8px;bottom:40px;border:1px solid var(--line);
    border-radius:11px 11px 0 0;box-shadow:0 -10px 34px rgba(0,0,0,.6)}
}
#drawer.open{height:var(--drawerh)}
.dpanel{display:none;height:100%;overflow-y:auto;padding:9px 11px}
.dpanel.on{display:block}
.dtitle{font-size:10px;color:var(--dim2);margin:0 0 3px 2px;letter-spacing:.3px;
  line-height:13px;height:13px;font-weight:600}
.skyc{width:100%;border-radius:7px}
#geoWrap{width:100%;height:calc(100% - 4px);min-height:120px;display:grid;place-items:center}
#geo{border-radius:7px;max-width:100%}
table.cmp{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
table.cmp th,table.cmp td{padding:4px 8px;border-bottom:1px solid rgba(34,48,74,.6);text-align:right;white-space:nowrap}
table.cmp th{text-align:left;color:var(--dim);font-weight:400;font-size:10.5px;width:36%;white-space:normal}
table.cmp td.a{color:#c9f6fd} table.cmp td.b{color:#ffe3bd}
table.cmp td.d{color:#dbe4f7;text-align:center}
table.cmp thead td{font-weight:700;font-size:11px}
table.cmp tr.grp th{color:var(--acc);font-size:10px;letter-spacing:.4px;padding-top:8px;text-transform:uppercase}
.notes{font-size:11.5px;color:var(--dim);line-height:1.7;max-width:820px}
.notes b{color:var(--txt);font-weight:600}
.notes ul{margin:5px 0 10px;padding-left:16px}
.notes li{margin-bottom:4px}
.k{color:var(--A)}

/* ---------- misc ---------- */
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:99;
  transition:opacity .4s;font-size:12.5px;color:var(--dim)}
#loader.gone{opacity:0;pointer-events:none}
.spin{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--A);
  animation:sp .9s linear infinite;margin:0 auto 11px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%,14px);background:#18233a;
  border:1px solid var(--line2);border-radius:9px;padding:8px 14px;font-size:12px;z-index:80;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--sh);max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#22304a;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div id="loader"><div style="text-align:center"><div class="spin"></div><div id="ldtxt">載入中…</div></div></div>
<div id="shell">

<header id="top">
  <div class="logo"></div>
  <div class="hgrow hrow">
    <h1 data-t="title">月相觀測模擬器</h1>
    <span class="sub" data-t="sub">同一時刻、不同地點，月亮長得不一樣</span>
  </div>
  <div class="topbtns">
    <button class="btn sm" id="btnScen" data-t="scen">情境</button>
    <button class="btn sm" id="btnShare" data-t="share">連結</button>
    <button class="btn sm" id="btnLang">EN</button>
  </div>
</header>

<div id="main">

  <!-- ============ 右側（橫式）／上方（直式）：兩組「地點＋時間＋月亮」 ============ -->
  <section id="side">
    <div id="units">

      <!-- ===== A：地點四格 + 時間（驅動日–地–月幾何） ===== -->
      <article class="card unit" id="unitA">
        <div class="uloc">
          <span class="tag tagA">A</span>
          <div class="ug ugcity"><select id="ctryA"></select><select id="cityA"></select></div>
          <div class="ug ugll">
            <input type="number" class="ll" id="latA" step="0.0001" min="-90" max="90" title="lat">
            <input type="number" class="ll" id="lonA" step="0.0001" min="-180" max="180" title="lon">
            <button class="btn sm gps" id="geoA" title="GPS">◎</button>
          </div>
        </div>
        <div class="trow">
          <span class="swt sync1 ghost" aria-hidden="true"><span class="cbw"><span class="cbx"></span></span><span class="mini" data-t="sameInstant">同 A</span></span>
          <div class="tgrid">
            <div class="tg3">
            <div><input type="number" id="yA" step="1" min="1600" max="2400"><label class="mini" data-t="yy">年</label></div>
            <div><input type="number" id="moA" step="1"><label class="mini" data-t="mm">月</label></div>
            <div><input type="number" id="dA" step="1"><label class="mini" data-t="dd">日</label></div>
            </div>
            <div class="tg3">
            <div><input type="number" id="hA" step="1"><label class="mini" data-t="hh">時</label></div>
            <div><input type="number" id="miA" step="1"><label class="mini" data-t="mi">分</label></div>
            <div><input type="number" id="sA" step="1"><label class="mini" data-t="ss">秒</label></div>
            </div>
          </div>
        </div>
        <div class="qrow">
          <div class="qg qg1">
            <select id="offA" class="tzsel"></select>
            <button class="btn sm" id="tNow" data-t="now">現在</button>
            <button class="btn sm" id="tPlay">▶</button>
            <select id="tSpeed" title="每 1 秒實際時間前進的模擬時間 / simulated time per real second">
              <option value="1" data-t="sp1">×1秒</option>
              <option value="60" data-t="sp60">×1分</option>
              <option value="600" data-t="sp600">×10分</option>
              <option value="3600" selected data-t="sp3600">×1時</option>
              <option value="21600" data-t="sp21600">×6時</option>
              <option value="86400" data-t="sp86400">×1日</option>
            </select>
          </div>
          <div class="qg qg2">
            <button class="btn sm" data-unit="A" data-step="-86400">−1d</button>
            <button class="btn sm" data-unit="A" data-step="-3600">−1h</button>
            <button class="btn sm" data-unit="A" data-step="3600">+1h</button>
            <button class="btn sm" data-unit="A" data-step="86400">+1d</button>
          </div>
        </div>
        <div class="ugrow" id="ugA"></div>
        <div class="ucanvas" id="cwA"><canvas id="moonA"></canvas>
        <div class="ustats" id="stA">
          <div><b id="sAalt">—</b><span data-t="alt">高度</span></div>
          <div><b id="sAaz">—</b><span data-t="az">方位</span></div>
          <div><b id="sAil">—</b><span data-t="illum">照明</span></div>
          <div><b id="sAage">—</b><span data-t="age">月齡</span></div>
        </div>
          <div class="mbadge" id="badgeA" hidden></div>
          <div class="mzoom"><span class="mzlab" id="mzlA" hidden>1.0&times;</span>
            <button class="zb mtog" id="mtgA" title="數值 / Stats">ⓘ</button>
            <button class="zb" id="mzoA">−</button><button class="zb" id="mziA">＋</button>
            <button class="zb" id="mzrA" hidden>⟲</button></div></div>
      </article>

      <!-- ===== B ===== -->
      <article class="card unit" id="unitB">
        <div class="uloc">
          <span class="tag tagB">B</span>
          <div class="ug ugcity"><select id="ctryB"></select><select id="cityB"></select></div>
          <div class="ug ugll">
            <input type="number" class="ll" id="latB" step="0.0001" min="-90" max="90" title="lat">
            <input type="number" class="ll" id="lonB" step="0.0001" min="-180" max="180" title="lon">
            <button class="btn sm gps" id="geoB" title="GPS">◎</button>
          </div>
        </div>
        <div class="trow frozen" id="btrow">

const D2R=Math.PI/180, R2D=180/Math.PI;

/* ---------- 儒略日 ---------- */
function jdFromUTC(y,mo,d,h,mi,s){
  let Y=y,M=mo;
  if(M<=2){Y-=1;M+=12;}
  const A=flr(Y/100), B=2-A+flr(A/4);
  return flr(365.25*(Y+4716))+flr(30.6001*(M+1))+d+B-1524.5+(h+mi/60+s/3600)/24;
}
function jdToUTC(jd){
  const z=flr(jd+0.5); let f=jd+0.5-z, A=z;
  if(z>=2299161){const a=flr((z-1867216.25)/36524.25); A=z+1+a-flr(a/4);}
  const B=A+1524, C=flr((B-122.1)/365.25), D=flr(365.25*C), E=flr((B-D)/30.6001);
  const dF=B-D-flr(30.6001*E)+f, d=flr(dF);
  let sec=Math.round((dF-d)*86400);
  const mo=(E<14)?E-1:E-13, y=(mo>2)?C-4716:C-4715;
  let h=flr(sec/3600); sec-=h*3600;
  let mi=flr(sec/60); sec-=mi*60;
  let dd=d;
  if(h>23){h-=24;dd+=1;}   /* 捨入溢位（極罕見） */
  return {y,mo,d:dd,h,mi,s:sec};
}

function deltaT(y,m){
  const yr=y+(m-0.5)/12; let t,u;
  if(yr<-500||yr>2150){u=(yr-1820)/100;return -20+32*u*u;}
  if(yr<500){u=yr/100;return 10583.6-1014.41*u+33.78311*u**2-5.952053*u**3-0.1798452*u**4+0.022174192*u**5+0.0090316521*u**6;}
  if(yr<1600){u=(yr-1000)/100;return 1574.2-556.01*u+71.23472*u**2+0.319781*u**3-0.8503463*u**4-0.005050998*u**5+0.0083572073*u**6;}
  if(yr<1700){t=yr-1600;return 120-0.9808*t-0.01532*t*t+t**3/7129;}
  if(yr<1800){t=yr-1700;return 8.83+0.1603*t-0.0059285*t*t+0.00013336*t**3-t**4/1174000;}
  if(yr<1860){t=yr-1800;return 13.72-0.332447*t+0.0068612*t*t+0.0041116*t**3-0.00037436*t**4+0.0000121272*t**5-0.0000001699*t**6+0.000000000875*t**7;}
  if(yr<1900){t=yr-1860;return 7.62+0.5737*t-0.251754*t*t+0.01680668*t**3-0.0004473624*t**4+t**5/233174;}
  if(yr<1920){t=yr-1900;return -2.79+1.494119*t-0.0598939*t*t+0.0061966*t**3-0.000197*t**4;}
  if(yr<1941){t=yr-1920;return 21.20+0.84493*t-0.076100*t*t+0.0020936*t**3;}
  if(yr<1961){t=yr-1950;return 29.07+0.407*t-t*t/233+t**3/2547;}
  if(yr<1986){t=yr-1975;return 45.45+1.067*t-t*t/260-t**3/718;}
  if(yr<2005){t=yr-2000;return 63.86+0.3345*t-0.060374*t*t+0.0017275*t**3+0.000651814*t**4+0.00002373599*t**5;}
  if(yr<2050){t=yr-2000;return 62.92+0.32217*t+0.005589*t*t;}
  u=(yr-1820)/100;return -20+32*u*u-0.5628*(2150-yr);
}

function nutation(T){
  const om=(125.04452-1934.136261*T+0.0020708*T*T+T**3/450000)*D2R;
  const L=(280.4665+36000.7698*T)*D2R, Lp=(218.3165+481267.8813*T)*D2R;
  return {dpsi:(-17.20*sin(om)-1.32*sin(2*L)-0.23*sin(2*Lp)+0.21*sin(2*om))/3600,
          deps:( 9.20*cos(om)+0.57*cos(2*L)+0.10*cos(2*Lp)-0.09*cos(2*om))/3600};
}

function riseSet(latD,lonD,jdStart,body){

  const N=96, step=1/N, res={rise:null,set:null,transit:null};

  for(let i=1;i<=N;i++){

    if(v>best){best=v;bestJd=jd;}
    if(prev<0&&v>=0) res.rise=res.rise??bisect(f,prevJd,jd);
    if(prev>=0&&v<0) res.set =res.set ??bisect(f,prevJd,jd);
    prev=v;prevJd=jd;
  }
  if(bestJd!==null&&best>-99){ /* 中天：在極值附近細找 */
    let lo=bestJd-step,hi=bestJd+step;
    for(let i=0;i<18;i++){const m1=lo+(hi-lo)/3,m2=hi-(hi-lo)/3; if(f(m1)<f(m2))lo=m1;else hi=m2;}

  res.alwaysDown=(res.rise===null&&res.set===null&&prev<0);

      GE.mode='chunk';GE.stat='chunk'; cancelRefine(); startRefine(cv,ctx,P,SD); } },4000);
  }else{
    let i=0;
    const step=()=>{
      const S=GE.pend; if(!S||S.id!==id)return;
      const t0=performance.now();
      while(i<nb&&performance.now()-t0<5){
        const h=ed[i+1]-ed[i];
        const bJ={}; for(const k in J)bJ[k]=J[k];
        bJ.by0=ed[i]; bJ.bh=h;
        const bi=LY.fc.createImageData(P.bw,h);
        fillSphere(bi.data,bJ,MIP.earth,MIP.lights,MIP.bump,MIP.water,ed[i],ed[i+1]);
        LY.fc.putImageData(bi,0,ed[i]-P.by0);
        i++;
      }
      S.need=nb-i;
      if(i>=nb){GE.lastMs=performance.now()-S.t0; startFade(S);}
      else GE.raf=requestAnimationFrame(step);
    };
    GE.raf=requestAnimationFrame(step);
  }
}
/* 精繪完成後淡入，避免模糊→銳利的瞬間跳動 */
function startFade(S){
  GE.pend=null; GE.raf=0;
  const P=S.p, ctx=S.ctx, id=S.id;
  GE.fade={id,t:0};
  const step=()=>{
    const f=GE.fade; if(!f||f.id!==id)return;
    f.t+=0.24;
    const a=f.t>=1?1:f.t*f.t*(3-2*f.t);
    composite(ctx,P,a);
    if(f.t<1) GE.raf=requestAnimationFrame(step);
    else {GE.raf=0; GE.fade=null;}
  };
  GE.raf=requestAnimationFrame(step);
}
/* ---------- 疊圖 ---------- */
function drawGlobeOverlay(ctx,P,scene,marks,view,quality,lang){
  const S=P.S, proj=P.proj;
  if(quality!=='low'){
    ctx.save(); ctx.lineWidth=1*S;
    const line=(pts,col)=>{ctx.strokeStyle=col;ctx.beginPath();let pen=false;
      for(const p of pts){if(p.z>0.002){if(pen)ctx.lineTo(p.x,p.y);else{ctx.moveTo(p.x,p.y);pen=true;}}else pen=false;}
      ctx.stroke();};
    for(let la=-60;la<=60;la+=30){const pts=[];for(let lo=-180;lo<=180;lo+=4)pts.push(proj(la,lo));
      line(pts,la===0?'rgba(150,200,255,.26)':'rgba(180,206,242,.10)');}
    for(let lo=-180;lo<180;lo+=30){const pts=[];for(let la=-88;la<=88;la+=4)pts.push(proj(la,lo));
      line(pts,lo===0?'rgba(150,200,255,.24)':'rgba(180,206,242,.10)');}
    ctx.restore();
  }
  const reserved=(view.avoid||[]).slice();
  const pS=proj(scene.subSolar.lat,scene.subSolar.lon), pM=proj(scene.subLunar.lat,scene.subLunar.lon);
  if(pS.z>0)reserved.push({x:pS.x-9*S,y:pS.y-9*S,w:76*S,h:18*S});
  if(pM.z>0)reserved.push({x:pM.x-9*S,y:pM.y-9*S,w:76*S,h:18*S});
  for(const m of marks){const q=proj(m.lat,m.lon);
    if(q.z>0)reserved.push({x:q.x-11*S,y:q.y-11*S,w:56*S,h:22*S});}
  drawCityLabels(ctx,P,view,lang,quality==='low'?0:undefined,reserved,view.sel||[]);
  const spot=(p,col,glyph,label)=>{
    if(p.z<=0)return;
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x,p.y,7.5*S,0,6.2832);
    ctx.fillStyle='rgba(6,10,18,.6)'; ctx.fill();
    ctx.strokeStyle=col; ctx.lineWidth=1.3*S; ctx.stroke();
    ctx.fillStyle=col; ctx.font=fnt('400',9.5*S);
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(glyph,p.x,p.y+.5*S);
    ctx.font=fnt('600',10*S); ctx.textAlign='left';
    const tx=p.x+12*S, ty=p.y-0.5*S, wd=ctx.measureText(label).width;
    ctx.fillStyle='rgba(5,8,16,.78)';
    ctx.beginPath(); ctx.roundRect(tx-4*S,ty-8*S,wd+8*S,16*S,5*S); ctx.fill();
    ctx.fillStyle=col; ctx.fillText(label,tx,ty);
    ctx.restore();
  };
  spot(pS,'#ffd75e','☀',lang==='en'?'Subsolar':'日下點');
  spot(pM,'#dfe6f5','☾',lang==='en'?'Sublunar':'月下點');
  for(const m of marks){
    const p=proj(m.lat,m.lon); if(p.z<=0)continue;
    ctx.save();
    ctx.beginPath(); ctx.arc(p.x,p.y,4.6*S,0,6.2832);
    ctx.fillStyle=m.col;
    if(quality!=='low'){ctx.shadowColor=m.col;ctx.shadowBlur=11*S;}   /* 陰影模糊在拖曳時太貴 */
    ctx.fill(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(p.x,p.y,9.5*S,0,6.2832);
    ctx.strokeStyle=m.col; ctx.globalAlpha=.55; ctx.lineWidth=1.2*S; ctx.stroke(); ctx.globalAlpha=1;
    ctx.font=fnt('700',11.5*S); ctx.textAlign='left'; ctx.textBaseline='middle';
    const tx=p.x+14*S, ty=p.y-S, wd=ctx.measureText(m.label).width;
    ctx.fillStyle='rgba(5,8,16,.78)';
    ctx.beginPath(); ctx.roundRect(tx-4*S,ty-8.5*S,wd+8*S,17*S,5*S); ctx.fill();
    ctx.fillStyle=m.col; ctx.fillText(m.label,tx,ty);
    ctx.restore();
  }
}
function drawCityLabels(ctx,P,view,lang,cap,reserved,skip){
  GLOBE_LABELS.length=0;
  if(!view.labels)return;
  const S=P.S, z=view.zoom;
  let mr=z<1.25?0:(z<2.0?1:2);
  if(cap!==undefined) mr=Math.min(mr,cap);
  const cand=[];
  for(let i=0;i<CITIES.length;i++){
    const c=CITIES[i]; if(c[5]>mr)continue;
    if(skip&&skip.indexOf(i)>=0)continue;
    const p=P.proj(c[2],c[3]); if(p.z<=0.07)continue;
    if(p.x<-30||p.x>P.W+30||p.y<-20||p.y>P.H+20)continue;
    cand.push({p,i,r:c[5]});
  }
  cand.sort((a,b)=>a.r-b.r||b.p.z-a.p.z);
  ctx.save();
  ctx.font=fnt('500',10.5*S); ctx.textBaseline='middle'; ctx.textAlign='left';
  const boxes=(reserved||[]).slice(), gap=2*S;
  for(const it of cand){
    if(GLOBE_LABELS.length>=72)break;
    const c=CITIES[it.i], txt=lang==='en'?c[1]:c[0];
    const w=ctx.measureText(txt).width+6*S, h=15*S;
    const bx=it.p.x+7*S, by=it.p.y-h/2;
    let hit=false;
    for(const b of boxes){
      if(bx<b.x+b.w+gap&&bx+w+gap>b.x&&by<b.y+b.h&&by+h>b.y){hit=true;break;}
    }
    if(hit)continue;
    boxes.push({x:bx,y:by,w,h});
    GLOBE_LABELS.push({x:it.p.x,y:it.p.y,bx,by,bw:w,bh:h,ci:it.i});
    ctx.fillStyle='rgba(5,9,17,.62)';
    ctx.beginPath(); ctx.roundRect(bx-3*S,by,w,h,4*S); ctx.fill();
    ctx.fillStyle=c[5]===0?'rgba(233,241,255,.95)':'rgba(206,219,242,.88)';
    ctx.fillText(txt,bx,by+h/2+0.5*S);
    ctx.beginPath(); ctx.arc(it.p.x,it.p.y,2*S,0,6.2832);
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.fill();
  }
  ctx.restore();
}
function pickCityLabel(px,py,S){
  for(const l of GLOBE_LABELS){
    if(px>=l.bx-5*S&&px<=l.bx+l.bw+3*S&&py>=l.by-2*S&&py<=l.by+l.bh+2*S)return l.ci;
    if(Math.hypot(px-l.x,py-l.y)<9*S)return l.ci;
  }
  return -1;
}

/* ============================================================
   天空顏色 / 受光球體
   ============================================================ */
const SKYK=[
 [ 60,[ 26, 88,190],[128,176,230]],[ 20,[ 30, 96,200],[140,186,236]],
 [  6,[ 40, 94,178],[184,200,222]],[  1,[ 46, 82,150],[228,178,126]],
 [ -1,[ 40, 64,126],[234,142, 82]],[ -4,[ 32, 50,104],[208, 98, 60]],
 [ -8,[ 22, 36, 80],[142, 64, 64]],[-12,[ 14, 24, 58],[ 64, 46, 84]],
 [-15,[ 10, 16, 42],[ 32, 30, 62]],[-18,[  7, 11, 30],[ 18, 22, 46]],
 [-90,[  4,  6, 16],[  9, 12, 27]]];
function skyCols(alt){
  if(alt>=SKYK[0][0])return [SKYK[0][1],SKYK[0][2]];
  for(let i=0;i<SKYK.length-1;i++){
    const a=SKYK[i],b=SKYK[i+1];
    if(alt<=a[0]&&alt>=b[0]){const t=(a[0]-alt)/(a[0]-b[0]);return [lerp3(a[1],b[1],t),lerp3(a[2],b[2],t)];}
  }
  return [SKYK[10][1],SKYK[10][2]];
}
function litSphere(ctx,cx,cy,R,L,cLit,cDark,stroke,lw){
  const p=Math.hypot(L.x,L.y);
  ctx.beginPath(); ctx.arc(cx,cy,R,0,6.2832); ctx.fillStyle=cDark; ctx.fill();
  if(p<1e-6){ if(L.z>0){ctx.fillStyle=cLit;ctx.fill();} }
  else{
    const ang=atan2(-L.y/p,L.x/p), e=-L.z;
    ctx.beginPath();
    ctx.ellipse(cx,cy,R,R,ang,-PI/2,PI/2,false);
    if(e>=0) ctx.ellipse(cx,cy,R*e,R,ang,PI/2,-PI/2,true);
    else     ctx.ellipse(cx,cy,-R*e,R,ang,PI/2,3*PI/2,false);
    ctx.closePath(); ctx.fillStyle=cLit; ctx.fill();
  }
  if(stroke){ctx.beginPath();ctx.arc(cx,cy,R,0,6.2832);ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();}
}

/* ============================================================
   月面視圖（天頂朝上，可縮放／平移）
   opt.zoom 放大倍率、opt.ox/oy 以基準半徑為單位的平移量
   ============================================================ */
const MOON_LON0=-101.997070, MOON_LON1=101.997070, MOON_LSPAN=MOON_LON1-MOON_LON0;
const MOON_FILL=0.42, MOON_CY=0.50;    /* 月面半徑佔畫布比例、圓心高度 */
function moonGeom(cv,ob,opt){
  const W=cv.width,H=cv.height;
  const S=clamp(W/(cv.clientWidth||W),1,3), small=(cv.clientWidth||W)<200;
  /* 方位環與其標籤必須留在畫布內，反推月面半徑上限 */
  const edge=Math.min(W*0.5,H*MOON_CY,H*(1-MOON_CY));
  const rmax=Math.max(Math.min(W,H)*0.30,(edge-(small?15:20)*S)/1.03);
  let base=Math.min(Math.min(W,H)*MOON_FILL,rmax);
  base*=(opt.trueSize?(ob.angDiam/31.08):1);
  const z=opt.zoom||1;
  return {W,H,S,small,base,R:base*z,z,
    cx:W/2+(opt.ox||0)*base, cy:H*MOON_CY+(opt.oy||0)*base};
}
function renderMoon(cv,ob,scene,opt){
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const W=cv.width,H=cv.height; if(!W||!H)return;
  const S=scaleOf(cv), small=(cv.clientWidth||W)<200;
  const [ct,cb]=skyCols(ob.sunAlt);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgbs(ct)); g.addColorStop(1,rgbs(cb));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const G=moonGeom(cv,ob,opt), R=G.R, cx=G.cx, cy=G.cy;
  const nf=clamp((-ob.sunAlt-9)/9,0,1);
  if(nf>0.02){
    ctx.save();
    for(const s of STARS){
      const sx=s[0]*W, sy=s[1]*H;
      if(Math.hypot(sx-cx,sy-cy)<R*1.5)continue;
      ctx.globalAlpha=nf*s[2]*0.85; ctx.fillStyle='#fff';
      const r=s[2]*1.15*S; ctx.fillRect(sx,sy,r,r);
    }
    ctx.restore();
  }
  const below=ob.alt<0;
  if(!below&&ob.k>0.03&&G.z<2.2){
    const gr=ctx.createRadialGradient(cx,cy,R*0.82,cx,cy,R*(2.0+1.5*nf));
    const a=(0.10+0.19*nf)*ob.k*clamp(1-ob.airmass/14,0.15,1);
    gr.addColorStop(0,'rgba(215,226,255,'+a.toFixed(3)+')');
    gr.addColorStop(1,'rgba(215,226,255,0)');
    ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);
  }
  const x0=Math.max(0,flr(cx-R-2)), x1=Math.min(W,Math.ceil(cx+R+2));
  const y0=Math.max(0,flr(cy-R-2)), y1=Math.min(H,Math.ceil(cy+R+2));
  if(x1>x0&&y1>y0&&TEX.moon){
    const im=ctx.getImageData(x0,y0,x1-x0,y1-y0), px=im.data, bw=x1-x0;
    const tw=TEX.moon.w, th=TEX.moon.h, td=TEX.moon.d;
    const L=ob.L, Xc=ob.Xc, Yc=ob.Yc, Zc=ob.Zc;
    let er,eg,eb2,dim;
    if(below){er=eg=eb2=1; dim=0.42;}
    else{const X=clamp(ob.airmass,1,18);
      er=pow(10,-0.4*0.10*(X-1)); eg=pow(10,-0.4*0.17*(X-1)); eb2=pow(10,-0.4*0.30*(X-1)); dim=1;}
    const df=clamp((ob.sunAlt+5)/13,0,1);
    const wash=[cb[0]*0.55+ct[0]*0.45,cb[1]*0.55+ct[1]*0.45,cb[2]*0.55+ct[2]*0.45];
    const earthshine=0.075*pow(1-ob.k,1.2);
    const invR=1/R;
    for(let y=y0;y<y1;y++){
      const ny=(cy-y+0.5)*invR;
      for(let x=x0;x<x1;x++){
        const nx=(x-cx+0.5)*invR, r2=nx*nx+ny*ny;
        if(r2>1.06)continue;
        const cov=clamp((1-sqrt(r2))*R+0.5,0,1); if(cov<=0.002)continue;
        const nz=sqrt(Math.max(0,1-Math.min(r2,1)));
        const bx=nx*Xc.x+ny*Xc.y+nz*Xc.z;
        const by=nx*Yc.x+ny*Yc.y+nz*Yc.z;
        const bz=nx*Zc.x+ny*Zc.y+nz*Zc.z;
        const lat=asin(clamp(bz,-1,1))*R2D, lon=atan2(by,bx)*R2D;
        let u=(lon-MOON_LON0)/MOON_LSPAN*(tw-1), v=(0.5-lat/180)*(th-1);
        u=clamp(u,0,tw-1.002); v=clamp(v,0,th-1.002);
        const ix=u|0, iy=v|0, fx=u-ix, fy=v-iy, i00=(iy*tw+ix)*4;
        const alb=(td[i00]*(1-fx)+td[i00+4]*fx)*(1-fy)+(td[i00+tw*4]*(1-fx)+td[i00+tw*4+4]*fx)*fy;
        const mu0=clamp(nx*L.x+ny*L.y+nz*L.z,0,1);
        let lit=2*mu0/(mu0+nz+0.0018); if(lit>1.42)lit=1.42;
        lit*=smooth(0,0.035,mu0);
        const b=alb*(lit+earthshine)/255*dim;
        let cr=b*er, cg=b*0.972*eg, cbb=b*0.925*eb2;
        if(below){cr*=0.62;cg*=0.66;cbb*=0.78;}
        let R8=clamp(cr*258,0,255), G8=clamp(cg*258,0,255), B8=clamp(cbb*258,0,255);
        if(df>0){const m=df*0.30;R8=R8*(1-m)+wash[0]*m;G8=G8*(1-m)+wash[1]*m;B8=B8*(1-m)+wash[2]*m;}
        const o=((y-y0)*bw+(x-x0))*4;
        px[o]=px[o]*(1-cov)+R8*cov;
        px[o+1]=px[o+1]*(1-cov)+G8*cov;
        px[o+2]=px[o+2]*(1-cov)+B8*cov;
      }
    }
    ctx.putImageData(im,x0,y0);
  }
  if(opt.ring!==false&&G.z<1.6){
    const rr=R*1.03+2*S;
    ctx.save();
    ctx.strokeStyle='rgba(200,214,240,.17)'; ctx.lineWidth=1*S;
    ctx.setLineDash([2*S,5*S]); ctx.beginPath(); ctx.arc(cx,cy,rr,0,6.2832); ctx.stroke();
    ctx.setLineDash([]);
    const tick=(ang,col,lab,ln)=>{
      const a=ang*D2R, ux=sin(a), uy=-cos(a);
      ctx.strokeStyle=col; ctx.lineWidth=1.7*S; ctx.beginPath();
      ctx.moveTo(cx+ux*(rr-S),cy+uy*(rr-S)); ctx.lineTo(cx+ux*(rr+ln*0.85*S),cy+uy*(rr+ln*0.85*S)); ctx.stroke();
      ctx.fillStyle=col; ctx.font=fnt('600',(small?9:10.5)*S);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const d2=rr+(small?9:12)*S;
      ctx.fillText(lab,cx+ux*d2,cy+uy*d2);
    };
    /* Z–N 夾角：這就是兩地月面看起來轉了多少 */
    const pa=n180(ob.poleAng);
    if(Math.abs(pa)>8){
      const ar=rr+(small?4:5)*S;
      ctx.strokeStyle='rgba(120,190,255,.45)'; ctx.lineWidth=1.6*S;
      ctx.beginPath(); ctx.arc(cx,cy,ar,-90*D2R,(pa-90)*D2R,pa<0); ctx.stroke();
      const am=pa/2*D2R, d3=ar-(small?10:13)*S;
      const tx=cx+sin(am)*d3, ty=cy-cos(am)*d3;
      ctx.font=fnt('600',(small?8.5:9.5)*S);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      const txt=Math.abs(pa).toFixed(0)+'°';
      const wd=ctx.measureText(txt).width;
      ctx.fillStyle='rgba(5,8,16,.72)';
      ctx.beginPath(); ctx.roundRect(tx-wd/2-3*S,ty-7*S,wd+6*S,14*S,4*S); ctx.fill();
      ctx.fillStyle='rgba(150,200,255,.95)'; ctx.fillText(txt,tx,ty);
    }
    tick(0,'rgba(152,172,208,.8)','Z',5);
    tick(ob.poleAng,'rgba(120,190,255,.92)','N',7);
    tick(ob.limbAng,'rgba(255,214,110,.95)','☉',7);
    ctx.restore();
  }
  ctx.save();
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.3,W/2,H/2,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.30)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H); ctx.restore();
}

/* ============================================================
   天空全景條
   ============================================================ */
function renderSkyStrip(cv,ob,scene,lang){
  const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; if(!W||!H)return;
  const S=scaleOf(cv), A0=-14,A1=92;
  const ax=az=>az/360*W, ay=al=>H-(al-A0)/(A1-A0)*H;
  const [ct,cb]=skyCols(ob.sunAlt), hz=ay(0);
  const g=ctx.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,rgbs(ct)); g.addColorStop(1,rgbs(cb));
  ctx.fillStyle=g; ctx.fillRect(0,0,W,hz);
  const sx=ax(ob.sunAz), sy=ay(clamp(ob.sunAlt,-13,91));
  const gr=ctx.createRadialGradient(sx,sy,0,sx,sy,W*0.30);
  const ga=clamp((ob.sunAlt+12)/24,0,1);
  gr.addColorStop(0,'rgba(255,226,150,'+(0.42*ga).toFixed(3)+')');
  gr.addColorStop(1,'rgba(255,200,120,0)');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,hz);
  if(ob.sunAlt<-9){
    ctx.save();
    for(const s of STARS){ctx.globalAlpha=s[2]*0.5;ctx.fillStyle='#e8eefb';ctx.fillRect(s[0]*W,s[1]*hz,S,S);}
    ctx.restore();
  }
  ctx.fillStyle='#090c14'; ctx.fillRect(0,hz,W,H-hz);
  ctx.strokeStyle='rgba(160,180,215,.45)'; ctx.lineWidth=1*S;
  ctx.beginPath(); ctx.moveTo(0,hz); ctx.lineTo(W,hz); ctx.stroke();
  ctx.save(); ctx.setLineDash([2*S,4*S]); ctx.strokeStyle='rgba(160,180,215,.16)'; ctx.lineWidth=1*S;
  for(const a of [30,60]){ctx.beginPath();ctx.moveTo(0,ay(a));ctx.lineTo(W,ay(a));ctx.stroke();}
  for(let az=45;az<360;az+=45){ctx.beginPath();ctx.moveTo(ax(az),0);ctx.lineTo(ax(az),hz);ctx.stroke();}
  ctx.restore();
  ctx.font=fnt('400',9.5*S); ctx.textBaseline='bottom'; ctx.textAlign='center';
  ctx.fillStyle='rgba(186,200,226,.78)';
  const NM=lang==='en'?['N','E','S','W','N']:['北','東','南','西','北'];
  [0,90,180,270,360].forEach((az,i)=>ctx.fillText(NM[i],clamp(ax(az),10*S,W-10*S),H-2*S));
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillStyle='rgba(186,200,226,.45)';
  ctx.fillText('60°',3*S,ay(60)); ctx.fillText('30°',3*S,ay(30));
  if(ob.sunAlt>-13){
    ctx.save(); ctx.beginPath(); ctx.arc(sx,sy,4.4*S,0,6.2832);
    ctx.fillStyle=ob.sunAlt>0?'#ffe07a':'#e89050';
    ctx.shadowColor='#ffd75e'; ctx.shadowBlur=10*S; ctx.fill(); ctx.restore();
  }
  const mx=ax(ob.az), my=ay(clamp(ob.alt,-13,91));
  const dx=sx-mx, dy=sy-my, dl=Math.hypot(dx,dy)||1;
  const lz=2*ob.k-1, ip=sqrt(Math.max(0,1-lz*lz));
  litSphere(ctx,mx,my,5.6*S,{x:dx/dl*ip,y:-dy/dl*ip,z:lz},

function renderGeo(cv,scene,obs,lang){
  const ctx=cv.getContext('2d'); const W=cv.width,H=cv.height; if(!W||!H)return;
  const S=scaleOf(cv);
  const gbg=ctx.createLinearGradient(0,0,0,H);
  gbg.addColorStop(0,'#050811'); gbg.addColorStop(1,'#080c18');
  ctx.fillStyle=gbg; ctx.fillRect(0,0,W,H);
  const EL=28*D2R;
  const Cv=V(0,-cos(EL),sin(EL)), Rv=V(-1,0,0), Uv=V(0,sin(EL),cos(EL));
  const cx=W*0.60, cy=H*0.52, orb=Math.min(W*0.31,H*0.40);
  const pr=p=>({x:cx+orb*dot(p,Rv),y:cy-orb*dot(p,Uv),z:dot(p,Cv)});
  const dl=(scene.moon.lon-scene.sun.lon)*D2R, be=scene.moon.lat*D2R;
  const mdir=V(cos(be)*cos(dl),cos(be)*sin(dl),sin(be));
  const sg=ctx.createLinearGradient(0,0,W*0.42,0);
  sg.addColorStop(0,'rgba(255,208,110,.26)'); sg.addColorStop(1,'rgba(255,208,110,0)');
  ctx.fillStyle=sg; ctx.fillRect(0,0,W*0.42,H);
  ctx.save();
  const sgr=ctx.createRadialGradient(-6*S,H/2,2,-6*S,H/2,H*0.62);
  sgr.addColorStop(0,'#fff0c0'); sgr.addColorStop(.35,'#ffca52'); sgr.addColorStop(1,'rgba(255,190,60,0)');
  ctx.fillStyle=sgr; ctx.beginPath(); ctx.arc(-6*S,H/2,H*0.62,0,6.2832); ctx.fill();
  ctx.restore();
  ctx.save();
  ctx.strokeStyle='rgba(255,214,120,.26)'; ctx.lineWidth=1*S; ctx.setLineDash([5*S,5*S]);
  for(let i=0;i<5;i++){const y=H*(0.16+i*0.17);ctx.beginPath();ctx.moveTo(W*0.10,y);ctx.lineTo(W*0.34,y);ctx.stroke();}
  ctx.restore();
  ctx.fillStyle='#ffd77a'; ctx.font=fnt('600',11*S);
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.fillText(lang==='en'?'SUN →':'太陽 →',9*S,9*S);
  ctx.save(); ctx.strokeStyle='rgba(150,175,220,.26)'; ctx.lineWidth=1*S; ctx.setLineDash([3*S,4*S]);
  ctx.beginPath();
  for(let a=0;a<=360;a+=3){const p=pr(V(cos(a*D2R),sin(a*D2R),0));if(a===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y);}
  ctx.stroke(); ctx.restore();
  const mp=pr(mdir);
  ctx.save(); ctx.lineWidth=1*S; ctx.setLineDash([4*S,3*S]);
  ctx.strokeStyle='rgba(150,175,220,.45)';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(mp.x,mp.y); ctx.stroke();
  ctx.strokeStyle='rgba(255,214,120,.45)';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx-orb*1.02,cy); ctx.stroke(); ctx.restore();
  const a1=atan2(mp.y-cy,mp.x-cx);
  ctx.save(); ctx.strokeStyle='rgba(138,168,255,.55)'; ctx.lineWidth=1.4*S;
  ctx.beginPath(); ctx.arc(cx,cy,orb*0.30,PI,a1,a1>0); ctx.stroke(); ctx.restore();
  const Re=Math.max(13*S,Math.min(W,H)*0.088);
  const Ls={x:dot(V(1,0,0),Rv),y:dot(V(1,0,0),Uv),z:dot(V(1,0,0),Cv)};
  litSphere(ctx,cx,cy,Re,Ls,'#2f74c4','#0d1b30','rgba(130,170,230,.5)',1*S);
  const eps=scene.eps*D2R, sl=scene.sun.lon*D2R;
  const npole=V(sin(eps)*sin(sl),sin(eps)*cos(sl),cos(eps));
  const pa=pr(mul(npole,Re/orb*1.45)), pb=pr(mul(npole,-Re/orb*1.45));
  ctx.save(); ctx.strokeStyle='rgba(190,210,245,.5)'; ctx.lineWidth=1*S; ctx.setLineDash([3*S,3*S]);
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); ctx.restore();
  for(const o of obs){
    const e=rotEq2Ecl(unit(o.ob.basis.pos),scene.eps);
    const cs=cos(-sl), sn=sin(-sl);
    const q=pr(mul(V(e.x*cs-e.y*sn,e.x*sn+e.y*cs,e.z),Re/orb));
    ctx.save();
    if(q.z<=0)ctx.globalAlpha=.3;
    ctx.beginPath(); ctx.arc(q.x,q.y,3.4*S,0,6.2832);
    ctx.fillStyle=o.col; ctx.shadowColor=o.col; ctx.shadowBlur=q.z>0?9*S:0; ctx.fill(); ctx.shadowBlur=0;
    ctx.font=fnt('700',10*S); ctx.textAlign='center'; ctx.textBaseline='bottom';
    ctx.fillText(o.label,q.x,q.y-5*S);
    ctx.restore();
  }
  const mToS=unit(sub(V(scene.sun.r,0,0),mul(mdir,scene.moon.r)));
  const Lm={x:dot(mToS,Rv),y:dot(mToS,Uv),z:dot(mToS,Cv)};
  const Rm=Math.max(6.5*S,Math.min(W,H)*0.042);
  ctx.save(); ctx.shadowColor='rgba(220,230,255,.5)'; ctx.shadowBlur=10*S;
  litSphere(ctx,mp.x,mp.y,Rm,Lm,'#e9eefb','#141a2a','rgba(200,214,240,.55)',1*S);
  ctx.restore();
  ctx.font=fnt('400',10*S); ctx.textAlign='right'; ctx.textBaseline='top';
  ctx.fillStyle='rgba(184,200,228,.88)';
  const en=lang==='en';
  const L1=en?'elongation':'日月距角',L2=en?'phase angle':'相位角',
        L3=en?'illuminated':'照明率',L4=en?'distance':'地心距',L5=en?'age':'月齡',
        L6=en?'ang. diameter':'視直徑';
  const adm=Math.atan2(1737.4*2,scene.moon.r)*R2D*60;
  ctx.fillText(L1+'  '+scene.elongEcl.toFixed(1)+'°',W-8*S,7*S);
  ctx.fillText(L2+'  '+scene.phase.toFixed(1)+'°',W-8*S,21*S);
  ctx.fillText(L3+'  '+(scene.k*100).toFixed(1)+'%',W-8*S,35*S);
  if(H>150*S){
    ctx.fillText(L5+'  '+scene.age.toFixed(1)+' d',W-8*S,49*S);
    ctx.fillText(L4+'  '+Math.round(scene.moon.r).toLocaleString()+' km',W-8*S,63*S);
    ctx.fillText(L6+'  '+adm.toFixed(2)+'′',W-8*S,77*S);
  }
  ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillStyle='rgba(150,166,196,.9)';
  ctx.fillText(lang==='en'?'not to scale':'非等比例',9*S,H-6*S);
}

function tzOffAt(tz,ms){
  try{
    const f=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour12:false,year:'numeric',month:'2-digit',
      day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const o={}; for(const p of f.formatToParts(new Date(ms))) o[p.type]=p.value;
    let hh=+o.hour; if(hh===24)hh=0;
    return Math.round((Date.UTC(+o.year,+o.month-1,+o.day,hh,+o.minute,+o.second)-ms)/60000)/60;
  }catch(e){return null;}
}
const lonOff=v=>Math.round(v.lon/15);
function offFromLocal(v){
  if(v.off!=='auto')return +v.off;
  if(!v.tz)return lonOff(v);
  let base=Date.UTC(v.y,v.mo-1,v.d,v.h,v.mi,Math.round(v.s));
  if(v.y>=0&&v.y<100){const d=new Date(base);d.setUTCFullYear(v.y);base=d.getTime();}
  let off=0;
  for(let i=0;i<3;i++){const r=tzOffAt(v.tz,base-off*3600000); if(r===null)return lonOff(v); off=r;}
  return off;
}
function offAtJD(v,jd){

}
const jdOf=v=>jdFromUTC(v.y,v.mo,v.d,v.h,v.mi,v.s)-offFromLocal(v)/24;
function setFromJD(v,jd){const u=jdToUTC(jd+offAtJD(v,jd)/24);
  v.y=u.y;v.mo=u.mo;v.d=u.d;v.h=u.h;v.mi=u.mi;v.s=u.s;}
function normFields(v){const u=jdToUTC(jdFromUTC(v.y,v.mo,v.d,v.h,v.mi,v.s));
  v.y=u.y;v.mo=u.mo;v.d=u.d;v.h=u.h;v.mi=u.mi;v.s=u.s;}
function applySync(){ if(ST.syncB) setFromJD(ST.B,jdOf(ST.A)); }

/* ---------- 格式 ---------- */
const p2=n=>String(n).padStart(2,'0');
const fmtT=v=>v.y+'-'+p2(v.mo)+'-'+p2(v.d)+' '+p2(v.h)+':'+p2(v.mi)+':'+p2(Math.round(v.s));
const fmtOff=o=>{const s=o<0?'−':'+',a=Math.abs(o);return 'UTC'+s+p2(Math.floor(a))+':'+p2(Math.round((a%1)*60));};
const fmtOffSel=o=>{const s=o<0?'−':'+',a=Math.abs(o);
  return s+p2(Math.floor(a))+':'+p2(Math.round((a%1)*60));};
const fmtOffS=o=>{const s=o<0?'−':'+',a=Math.abs(o),m=Math.round((a%1)*60);
  return s+Math.floor(a)+(m?':'+p2(m):'');};
const fmtJD=jd=>fmtT(jdToUTC(jd));
const hm=jd=>{const u=jdToUTC(jd+0.5/1440);return p2(u.h)+':'+p2(u.mi);};
const dirName=az=>T.dirs[Math.round(n360(az)/22.5)%16];
const fmtLL=(la,lo)=>Math.abs(la).toFixed(3)+'°'+(la>=0?'N':'S')+' '+Math.abs(lo).toFixed(3)+'°'+(lo>=0?'E':'W');
const skyIdx=a=>a>=-0.833?4:a>=-6?3:a>=-12?2:a>=-18?1:0;
const cName=i=>i<0||i==null?T.custom:(ST.lang==='en'?CITIES[i][1]:CITIES[i][0]);
const coName=i=>ST.lang==='en'?COUNTRIES[i][1]:COUNTRIES[i][0];

/* ---------- 版面尺寸 ---------- */
let layoutBusy=false;
const isLand=()=>matchMedia('(min-aspect-ratio:11/10)').matches;
let MOONW=0,SKYH=80;
function fitLayout(){
  if(layoutBusy)return; layoutBusy=true;
  const gp=$('gpane').getBoundingClientRect(), land=isLand();
  /* 抽屉高度：以「天空」面板的實際高度為準
     = 內邊距 18 + 兩列標題 16+24 + 兩張天空圖 2×sh */
  const dw=land?gp.width:Math.max(220,$('main').clientWidth-16);
  const sh=Math.round(clamp((dw-24)*0.24,58,92)); SKYH=sh;   /* sizeAll 直接沿用，兩邊不會算不一樣 */
  const cap=(land?gp.height:$('main').clientHeight)*0.72;
  const dh=Math.round(clamp(2*sh+60,150,cap));          /* 內邊距 18 + 標題 16+24 + 邊框 2 */
  root.style.setProperty('--drawerh',dh+'px');
  ST.view.padBottom=32+(ST.tab&&land?Math.round(dh*0.8):0);
  const uA=$('unitA'),uB=$('unitB');
  const chA=uA.offsetHeight-$('cwA').offsetHeight-$('ugA').offsetHeight+6;
  const chB=uB.offsetHeight-$('cwB').offsetHeight-$('ugB').offsetHeight+6;
  const innerW=uA.clientWidth-16;
  let w;
  if(land){
    const avail=$('side').clientHeight-chA-chB-16;
    w=Math.min(innerW,380,Math.max(142,avail/2));
  }else{
    const avail=$('main').clientHeight*0.55-Math.max(chA,chB)-10;
    w=Math.min(innerW,380,Math.max(132,avail));
  }
  w=Math.round(w); MOONW=w;
  const cur=parseFloat(getComputedStyle(root).getPropertyValue('--moonw'))||0;
  if(Math.abs(cur-w)>1) root.style.setProperty('--moonw',w+'px');
  layoutBusy=false;
}
function fit(cv,maxW,rect){
  const r=rect||cv.getBoundingClientRect(); if(!r.width||!r.height)return false;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  let w=Math.round(r.width*dpr), h=Math.round(r.height*dpr);
  if(maxW&&w>maxW){const k=maxW/w;w=Math.round(w*k);h=Math.round(h*k);}
  if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;return true;}
  return false;
}
function sizeAll(){
  dropAvoid();
  fit($('globe'),GE.mode==='worker'?1440:1100);
  fit($('moonA'),640); fit($('moonB'),640);
  if(ST.tab==='sky'){
    const p=document.querySelector('.dpanel[data-p="sky"]');
    const w=p.clientWidth-22;
    if(w>10){ for(const id of ['skyA','skyB']){ const c=$(id);
      c.style.height=SKYH+'px'; c.style.width='100%'; fit(c,760); } }
  }
  if(ST.tab==='geo'){
    const wrap=$('geoWrap'), g=$('geo');
    const w=wrap.clientWidth, h=Math.round(Math.min(wrap.clientHeight, w*0.58));
    if(w>10&&h>10){ g.style.width=w+'px'; g.style.height=h+'px'; fit(g,900); }
  }
}

/* ---------- 主更新 ---------- */
let scene=null,sceneB=null,obA=null,obB=null,rsCache=null,tblT=0;
function refresh(opt){
  opt=opt||{};
  const jdA=jdOf(ST.A);
  scene=buildScene(jdA);
  obA=observe(scene,ST.A.lat,ST.A.lon,0);
  const jdB=ST.syncB?jdA:jdOf(ST.B);
  sceneB=ST.syncB?scene:buildScene(jdB);
  obB=observe(sceneB,ST.B.lat,ST.B.lon,0);
  rsCache=null;
  drawAll(opt.q);
  updateText();
  if(!opt.noHash) queueHash();
}
let AVOID=null;
const dropAvoid=()=>{AVOID=null;};
function overlayAvoid(){
  if(AVOID)return AVOID;
  const cv=$('globe'), r=cv.getBoundingClientRect(), s=cv.width/(r.width||1), out=[];
  for(const sel of ['.gov.tr','#tabbar']){
    const e=document.querySelector(sel); if(!e)continue;
    const b=e.getBoundingClientRect(); if(!b.width||!b.height)continue;
    out.push({x:(b.left-r.left)*s,y:(b.top-r.top)*s,w:b.width*s,h:b.height*s});
  }
  AVOID=out; return out;
}
const marksOf=()=>{ST.view.sel=[ST.A.name,ST.B.name]; ST.view.avoid=overlayAvoid();
  return [{lat:ST.A.lat,lon:ST.A.lon,col:'#45d9e8',label:'A'},
          {lat:ST.B.lat,lon:ST.B.lon,col:'#ffb35c',label:'B'}];};
function moonOpt(t){const m=ST[t+'2'];
  return {trueSize:ST.trueSize,zoom:m.z,ox:m.ox,oy:m.oy};}
function drawMoon(t){
  renderMoon($('moon'+t),t==='A'?obA:obB,t==='A'?scene:sceneB,moonOpt(t));
  const m=ST[t+'2'], on=m.z>1.001;
  $('mzl'+t).hidden=!on; $('mzr'+t).hidden=!on;
  if(on)$('mzl'+t).textContent=m.z.toFixed(1)+'\u00d7';
  $('cw'+t).classList.toggle('pan',on);
}
function drawAll(q){
  drawMoon('A'); drawMoon('B');
  renderGlobe($('globe'),scene,ST.view,marksOf(),q,ST.lang);
  if(ST.tab==='sky'){renderSkyStrip($('skyA'),obA,scene,ST.lang);renderSkyStrip($('skyB'),obB,sceneB,ST.lang);}
  if(ST.tab==='geo')renderGeo($('geo'),scene,[{ob:obA,col:'#45d9e8',label:'A'},{ob:obB,col:'#ffb35c',label:'B'}],ST.lang);
}
const drawGlobeOnly=q=>renderGlobe($('globe'),scene,ST.view,marksOf(),q,ST.lang);
function updateText(){
  const set=(k,v)=>{const e=$(k); if(e&&e.textContent!==v)e.textContent=v;};
  for(const [t,v,ob,sc] of [['A',ST.A,obA,scene],['B',ST.B,obB,sceneB]]){
    if($('time'+t)){
      const off=offFromLocal(v);
      set('time'+t, innerWidth<640
        ? p2(v.mo)+'-'+p2(v.d)+' '+p2(v.h)+':'+p2(v.mi)+' '+fmtOffS(off)
        : fmtT(v)+'  '+fmtOff(off));
    }
    set('s'+t+'alt',ob.alt.toFixed(1)+'°');
    set('s'+t+'az',ob.az.toFixed(0)+'°'+(MOONW&&MOONW<200?'':' '+dirName(ob.az)));
    set('s'+t+'il',(ob.k*100).toFixed(1)+'%');
    set('s'+t+'age',sc.age.toFixed(1)+'d');
    const b=$('badge'+t);
    if(ob.alt<0){b.hidden=false;b.className='mbadge warn';b.textContent=T.below;}
    else if(ob.sunAlt>-0.5){b.hidden=false;b.className='mbadge';b.textContent=T.daylit;}
    else b.hidden=true;
  }
  $('gInfo').textContent=fmtT(ST.A)+' '+fmtOff(offFromLocal(ST.A))+'  ·  '+(GE.stat||'…');
  const now=performance.now();
  if(ST.tab==='tbl'&&(!ST.play||now-tblT>300)){tblT=now;buildTable();}
}
/* 下一次黃經距角 = target（0＝朔、1 80＝望），以平均角速做不動點迭代 */
const RATE=360/29.530588853;
function nextPhase(jd0,target){
  const f=j=>n360(buildScene(j).elongEcl-target);
  let j=jd0+(360-f(jd0))/RATE;
  for(let i=0;i<8;i++) j-=n180(f(j))/RATE;
  return j;
}
const durTxt=d=>{const h=Math.round(d*24),dd=Math.floor(h/24),hh=h%24;
  return (dd?dd+'d ':'')+hh+'h';};
function buildTable(){
  if(!scene)return;
  const R=T.rows;
  if(!rsCache&&!ST.play){
    const mk=(v,jd)=>{const off=offAtJD(v,jd),u=jdToUTC(jd+off/24),
      j0=jdFromUTC(u.y,u.mo,u.d,0,0,0)-off/24;
      return {off,rs:riseSet(v.lat,v.lon,j0,'moon'),srs:riseSet(v.lat,v.lon,j0,'sun')};};
    rsCache={A:mk(ST.A,jdOf(ST.A)),B:mk(ST.B,ST.syncB?jdOf(ST.A):jdOf(ST.B))};
    rsCache.nw=nextPhase(scene.jdUT,0); rsCache.fl=nextPhase(scene.jdUT,180);
  }
  const rsTxt=(c,key)=>{
    if(!c)return '…';
    const r=c[key||'rs'],off=c.off;
    if(r.alwaysUp)return T.up; if(r.alwaysDown)return T.down;
    const f=j=>j===null?'—':hm(j+off/24);
    return f(r.rise)+' / '+f(r.transit)+' / '+f(r.set);
  };
  const rows=[];
  const grp=t=>rows.push('<tr class="grp"><th colspan="3">'+t+'</th></tr>');
  const row=(l,a,b)=>rows.push('<tr><th>'+l+'</th><td class="a">'+a+'</td><td class="b">'+b+'</td></tr>');
  rows.push('<thead><tr><th></th><td class="a">A</td><td class="b">B</td></tr></thead>');
  grp(R.obs);
  row(R.loc,cName(ST.A.name),cName(ST.B.name));
  row(R.coord,fmtLL(ST.A.lat,ST.A.lon),fmtLL(ST.B.lat,ST.B.lon));
  row(R.ltime,fmtT(ST.A)+'<br><span style="color:var(--dim2)">'+fmtOff(offFromLocal(ST.A))+'</span>',
               fmtT(ST.B)+'<br><span style="color:var(--dim2)">'+fmtOff(offFromLocal(ST.B))+'</span>');
  row(R.utc,fmtJD(scene.jdUT),fmtJD(sceneB.jdUT));
  grp(R.moon);
  row(R.malt,obA.alt.toFixed(2)+'°',obB.alt.toFixed(2)+'°');
  row(R.maz,obA.az.toFixed(1)+'° '+dirName(obA.az),obB.az.toFixed(1)+'° '+dirName(obB.az));
  row(R.limb,obA.limbAng.toFixed(1)+'°',obB.limbAng.toFixed(1)+'°');
  row(R.pole,obA.poleAng.toFixed(1)+'°',obB.poleAng.toFixed(1)+'°');
  row(R.ill,(obA.k*100).toFixed(2)+'%',(obB.k*100).toFixed(2)+'%');
  row(R.agep,scene.age.toFixed(2)+'d<br><span style="color:var(--dim2)">'+T.ph[phaseKey(scene.elongEcl,scene.k)]+'</span>',
             sceneB.age.toFixed(2)+'d<br><span style="color:var(--dim2)">'+T.ph[phaseKey(sceneB.elongEcl,sceneB.k)]+'</span>');
  row(R.pang,obA.phase.toFixed(2)+'°',obB.phase.toFixed(2)+'°');
  row(R.elo,obA.elong.toFixed(2)+'°',obB.elong.toFixed(2)+'°');
  row(R.lib,obA.libLon.toFixed(2)+'° / '+obA.libLat.toFixed(2)+'°',
            obB.libLon.toFixed(2)+'° / '+obB.libLat.toFixed(2)+'°');
  row(R.dist,Math.round(obA.dist).toLocaleString()+' km<br><span style="color:var(--dim2)">'+obA.angDiam.toFixed(2)+"′</span>",
             Math.round(obB.dist).toLocaleString()+' km<br><span style="color:var(--dim2)">'+obB.angDiam.toFixed(2)+"′</span>");
  row(R.rs,rsTxt(rsCache&&rsCache.A),rsTxt(rsCache&&rsCache.B));
  grp(R.sky);
  row(R.srs,rsTxt(rsCache&&rsCache.A,'srs'),rsTxt(rsCache&&rsCache.B,'srs'));
  row(R.salt,obA.sunAlt.toFixed(2)+'°',obB.sunAlt.toFixed(2)+'°');
  row(R.saz,obA.sunAz.toFixed(1)+'° '+dirName(obA.sunAz),obB.sunAz.toFixed(1)+'° '+dirName(obB.sunAz));
  row(R.state,T.skies[skyIdx(obA.sunAlt)],T.skies[skyIdx(obB.sunAlt)]);
  row(R.vis,obA.alt>0?T.visOK:T.visNo,obB.alt>0?T.visOK:T.visNo);
  const one=(l,v)=>rows.push('<tr><th>'+l+'</th><td class="d" colspan="2">'+v+'</td></tr>');
  const sg=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(2);
  grp(R.diff);
  one(R.dpole,sg(n180(obA.poleAng-obB.poleAng))+'°');
  one(R.dlimb,sg(n180(obA.limbAng-obB.limbAng))+'°');
  one(R.dalt,sg(obA.alt-obB.alt)+'°');
  one(R.dill,sg((obA.k-obB.k)*100)+'%');
  grp(R.sched);
  if(rsCache){
    const pTxt=jd=>fmtJD(jd+offAtJD(ST.A,jd)/24)+'<br><span style="color:var(--dim2)">'
      +durTxt(jd-scene.jdUT)+' '+R.tonext+'</span>';
    one(R.nnew,pTxt(rsCache.nw));
    one(R.nfull,pTxt(rsCache.fl));
  }else{ one(R.nnew,'…'); one(R.nfull,'…'); }
  $('cmpTbl').innerHTML=rows.join('');
}

/* ---------- 國家 / 城市 選單 ---------- */
function opt(sel,val,txt){const o=document.createElement('option');o.value=val;o.textContent=txt;sel.appendChild(o);return o;}
function fillCountries(){
  for(const t of ['A','B']){
    const s=$('ctry'+t); s.innerHTML='';
    opt(s,'-1',T.customC);
    COUNTRIES.forEach((c,i)=>opt(s,i,coName(i)));
  }
}
function fillCities(t){
  const v=ST[t], s=$('city'+t); s.innerHTML='';
  if(v.name<0||v.name==null){ opt(s,'-1',T.custom); s.value='-1'; s.disabled=true; return; }
  s.disabled=false;
  const co=CITIES[v.name][6];
  for(const ci of BY_COUNTRY[co]) opt(s,ci,cName(ci));
  s.value=String(v.name);
}
function applyCity(t,ci){
  const v=ST[t], c=CITIES[ci];
  v.name=ci; v.lat=c[2]; v.lon=c[3]; v.tz=c[4]; v.off='auto';
  if(t==='B'||ST.syncB) applySync();
  syncForm(); refresh();
}
function setCustom(t,lat,lon){
  const v=ST[t]; v.lat=clamp(lat,-90,90); v.lon=n180(lon); v.name=-1; v.tz=null;
  applySync(); syncForm(); refresh();
}

/* ---------- 表單 ---------- */
const FLD=['y','mo','d','h','mi','s'];
function fillOffsets(){
  for(const t of ['A','B']){
    const s=$('off'+t); s.innerHTML='';
    opt(s,'auto',T.auto);
    OFFS.forEach(v=>opt(s,v,fmtOffSel(v)));
  }
}
function syncForm(){
  for(const t of ['A','B']){
    const v=ST[t];
    $('ctry'+t).value=(v.name<0||v.name==null)?'-1':String(CITIES[v.name][6]);
    fillCities(t);
    $('lat'+t).value=v.lat.toFixed(4); $('lon'+t).value=v.lon.toFixed(4);
    const os=$('off'+t); os.value=String(v.off);
    if(os.firstChild) os.firstChild.textContent=v.tz?T.auto:T.autoLon;
  }
  const setF=(t,v)=>FLD.forEach(f=>{const e=$(f+t); if(!e)return;
    const nv=String(f==='s'?Math.round(v.s):v[f]);
    if(document.activeElement!==e&&e.value!==nv)e.value=nv;});
  setF('A',ST.A); setF('B',ST.B);
  $('syncB').checked=ST.syncB;
  $('btrow').classList.toggle('frozen',ST.syncB);
  if(ST.syncB&&ST.playB) setPlay('B',false);
  FLD.forEach(f=>{const e=$(f+'B'); if(e)e.disabled=ST.syncB;});
  ['tNowB','tPlayB','tSpeedB'].forEach(id=>{const e=$(id); if(e)e.disabled=ST.syncB;});
  document.querySelectorAll('[data-unit="B"][data-step]').forEach(b=>{b.disabled=ST.syncB;});
}
function bindForm(){
  for(const t of ['A','B']){
    $('ctry'+t).addEventListener('change',e=>{
      const i=+e.target.value;
      if(i<0){ ST[t].name=-1; ST[t].tz=null; applySync(); syncForm(); refresh(); }
      else applyCity(t,BY_COUNTRY[i][0]);
    });
    $('city'+t).addEventListener('change',e=>{const i=+e.target.value; if(i>=0)applyCity(t,i);});
    for(const f of ['lat','lon']) $(f+t).addEventListener('change',e=>{
      const x=parseFloat(e.target.value); if(isNaN(x))return;
      setCustom(t,f==='lat'?x:ST[t].lat,f==='lon'?x:ST[t].lon);
    });
    $('off'+t).addEventListener('change',e=>{ST[t].off=e.target.value;applySync();syncForm();refresh();});
    $('geo'+t).addEventListener('click',()=>{
      if(!navigator.geolocation)return toast(T.gpsFail);
      navigator.geolocation.getCurrentPosition(p=>{
        const v=ST[t]; v.lat=clamp(p.coords.latitude,-90,90); v.lon=n180(p.coords.longitude);
        v.name=-1; v.tz=Intl.DateTimeFormat().resolvedOptions().timeZone||null; v.off='auto';
        ST.view.lat=v.lat; ST.view.lon=v.lon;
        applySync(); syncForm(); refresh();
      },()=>toast(T.gpsFail),{timeout:8000});
    });
    FLD.forEach(f=>{
      const el=$(f+t); if(!el)return;
      el.addEventListener('change',()=>{
        const x=parseInt(el.value,10); if(isNaN(x))return;
        ST[t][f]=x; normFields(ST[t]);
        if(t==='A')applySync(); else ST.syncB=false;
        syncForm(); refresh();
      });
    });
  }
  $('syncB').addEventListener('change',e=>{ST.syncB=e.target.checked;applySync();syncForm();fitLayout();sizeAll();refresh();});
  for(const t of ['A','B']){
    const sfx=(t==='A'?'':'B');
    $('tNow'+sfx).addEventListener('click',()=>{
      setFromJD(ST[t],Date.now()/86400000+2440587.5);
      if(t==='A')applySync(); syncForm(); refresh();});
    $('tSpeed'+sfx).addEventListener('change',e=>{ST[t==='A'?'speed':'speedB']=+e.target.value;});
    $('tPlay'+sfx).addEventListener('click',()=>setPlay(t,!(t==='A'?ST.play:ST.playB)));
  }
  document.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{
    const t=b.dataset.unit||'A';
    setFromJD(ST[t],jdOf(ST[t])+(+b.dataset.step)/86400);
    if(t==='A')applySync(); syncForm(); refresh();}));
  for(const t of ['A','B']) $('mtg'+t).addEventListener('click',()=>{setStats(!ST.stats);queueHash();});
  $('tgtA').addEventListener('click',()=>goTarget('A'));
  $('tgtB').addEventListener('click',()=>goTarget('B'));
  $('gZin').addEventListener('click',()=>{ST.view.zoom=clamp(ST.view.zoom*1.4,0.55,8);drawGlobeOnly();});
  $('gZout').addEventListener('click',()=>{ST.view.zoom=clamp(ST.view.zoom/1.4,0.55,8);drawGlobeOnly();});
  $('gSpin').addEventListener('click',()=>{ST.view.spin=!ST.view.spin;
    $('gSpin').classList.toggle('on',ST.view.spin);
    if(ST.view.spin)startLoop();
    else if(!ST.play&&!ST.playB) drawGlobeOnly();});
  $('gLabels').addEventListener('click',()=>{ST.view.labels=!ST.view.labels;
    $('gLabels').classList.toggle('on',ST.view.labels); drawGlobeOnly();});
  $('btnLang').addEventListener('click',()=>setLang(ST.lang==='zh'?'en':'zh'));
  $('btnShare').addEventListener('click',share);
  $('btnScen').addEventListener('click',nextScenario);
  document.querySelectorAll('#tabbar .tb').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.p)));
}
function setTarget(t){ST.target=t;$('tgtA').classList.toggle('on',t==='A');$('tgtB').classList.toggle('on',t==='B');}
function goTarget(t){setTarget(t);ST.view.lat=ST[t].lat;ST.view.lon=ST[t].lon;drawGlobeOnly();}
function setTab(p){
  ST.tab=(ST.tab===p)?null:p;
  document.querySelectorAll('#tabbar .tb').forEach(b=>b.classList.toggle('on',b.dataset.p===ST.tab));
  document.querySelectorAll('.dpanel').forEach(d=>d.classList.toggle('on',d.dataset.p===ST.tab));
  $('drawer').classList.toggle('open',!!ST.tab);
  dropAvoid(); fitLayout();
  if(ST.tab==='tbl') buildTable();          /* 不依賴 rAF，分頁隱藏時也會建表 */
  requestAnimationFrame(()=>{sizeAll();drawAll();});
  setTimeout(()=>{sizeAll();drawAll();},250);
}

/* ---------- 地球互動 ---------- */
function globeSetup(){
  const cv=$('globe'); const ptr=new Map(); let last=null,moved=0,pinch=0,z0=1;
  const geom=()=>{const r=cv.getBoundingClientRect();
    return {r,S:cv.width/(r.width||1),pad:ST.view.padBottom,
      R:Math.min(r.width,r.height-ST.view.padBottom)*0.44*ST.view.zoom};};
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1){last={x:e.clientX,y:e.clientY};moved=0;}
    else if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);z0=ST.view.zoom;moved=99;}
  });
  cv.addEventListener('pointermove',e=>{
    if(!ptr.has(e.pointerId))return;
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size>=2){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch>4){ST.view.zoom=clamp(z0*d/pinch,0.55,8);drawGlobeOnly('low');} return;}
    if(!last)return;
    const dx=e.clientX-last.x, dy=e.clientY-last.y;
    moved+=Math.abs(dx)+Math.abs(dy); last={x:e.clientX,y:e.clientY};
    const R=geom().R||1;
    ST.view.lon=n180(ST.view.lon-dx/R*R2D);
    ST.view.lat=clamp(ST.view.lat+dy/R*R2D,-89.5,89.5);
    drawGlobeOnly('low');
  });
  const end=e=>{
    if(ptr.has(e.pointerId)){ if(ptr.size===1&&moved<7)pick(e); ptr.delete(e.pointerId); }
    if(ptr.size<2)pinch=0;
    if(ptr.size===0){last=null;drawGlobeOnly();}
    else{const a=[...ptr.values()];last={x:a[0].x,y:a[0].y};}
  };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('wheel',e=>{e.preventDefault();
    ST.view.zoom=clamp(ST.view.zoom*(e.deltaY<0?1.16:1/1.16),0.55,8);drawGlobeOnly();},{passive:false});
  function pick(e){
    const g=geom();
    const px=(e.clientX-g.r.left)*g.S, py=(e.clientY-g.r.top)*g.S;
    const ci=pickCityLabel(px,py,cv.width/(g.r.width||1));
    if(ci>=0){ applyCity(ST.target,ci); return; }
    const P=globeParams(cv,ST.view); if(!P)return;
    const q=P.unproj(px,py); if(!q)return;
    setCustom(ST.target,q.lat,q.lon);
  }
}
/* ---------- 月面縮放 / 平移 ---------- */
function moonBase(t){
  const cv=$('moon'+t), ob=(t==='A'?obA:obB); if(!ob||!cv.width)return 0;
  return moonGeom(cv,ob,{trueSize:ST.trueSize,zoom:1,ox:0,oy:0}).base;
}
function moonClamp(t){
  const m=ST[t+'2'];
  if(m.z<=1.001){m.z=1;m.ox=0;m.oy=0;return;}
  const lim=m.z-0.35;
  m.ox=clamp(m.ox,-lim,lim); m.oy=clamp(m.oy,-lim,lim);
}
function moonZoom(t,nz,px,py){
  const m=ST[t+'2'], b=moonBase(t); if(!b)return;
  nz=clamp(nz,1,5);
  const cv=$('moon'+t), W=cv.width, H=cv.height;
  if(px===undefined){px=W/2;py=H*MOON_CY;}
  const cx=W/2+m.ox*b, cy=H*MOON_CY+m.oy*b, f=nz/m.z;
  m.z=nz;
  m.ox=(px+(cx-px)*f-W/2)/b; m.oy=(py+(cy-py)*f-H*MOON_CY)/b;
  moonClamp(t); drawMoon(t);
}
function moonSetup(t){
  const cv=$('moon'+t), m=ST[t+'2'];
  const ptr=new Map(); let last=null,pinch=0,z0=1;
  const dev=e=>{const r=cv.getBoundingClientRect(),s=cv.width/(r.width||1);
    return {x:(e.clientX-r.left)*s,y:(e.clientY-r.top)*s,s};};
  cv.addEventListener('wheel',e=>{e.preventDefault();
    const p=dev(e); moonZoom(t,m.z*(e.deltaY<0?1.2:1/1.2),p.x,p.y);},{passive:false});
  cv.addEventListener('dblclick',e=>{e.preventDefault();m.z=1;m.ox=0;m.oy=0;drawMoon(t);});
  cv.addEventListener('pointerdown',e=>{
    cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1){last={x:e.clientX,y:e.clientY};}
    else if(ptr.size===2){const a=[...ptr.values()];pinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);z0=m.z;}
  });
  cv.addEventListener('pointermove',e=>{
    if(!ptr.has(e.pointerId))return;
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size>=2){
      const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch>4){const r=cv.getBoundingClientRect(),s=cv.width/(r.width||1);
        moonZoom(t,z0*d/pinch,((a[0].x+a[1].x)/2-r.left)*s,((a[0].y+a[1].y)/2-r.top)*s);}
      return;
    }
    if(!last||m.z<=1.001)return;
    const b=moonBase(t); if(!b)return;
    const r=cv.getBoundingClientRect(),s=cv.width/(r.width||1);
    m.ox+=(e.clientX-last.x)*s/b; m.oy+=(e.clientY-last.y)*s/b;
    last={x:e.clientX,y:e.clientY};
    moonClamp(t); drawMoon(t);
  });
  const end=e=>{ ptr.delete(e.pointerId); if(ptr.size<2)pinch=0;
    if(ptr.size===0)last=null; else {const a=[...ptr.values()];last={x:a[0].x,y:a[0].y};} };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  $('mzi'+t).addEventListener('click',()=>moonZoom(t,m.z*1.5));
  $('mzo'+t).addEventListener('click',()=>moonZoom(t,m.z/1.5));
  $('mzr'+t).addEventListener('click',()=>{m.z=1;m.ox=0;m.oy=0;drawMoon(t);});
}
/* ---------- 動畫 ---------- */
let raf=null,lastT=0;
/* 欄位只存到秒，所以播放時另外累加浮點 JD；
   使用者自己改時間時差超過 1.5 秒，就重新以欄位為準。*/
const ACC={A:null,B:null};
function stepJD(t,d){
  const cur=jdOf(ST[t]);
  let a=ACC[t];
  if(a===null||Math.abs(a-cur)>1.5/86400) a=cur;
  a+=d; setFromJD(ST[t],a); ACC[t]=a;
}
function setStats(v){
  ST.stats=v;
  for(const t of ['A','B']){
    const s=$('st'+t), b=$('mtg'+t);
    if(s)s.hidden=!v;
    if(b)b.classList.toggle('on',v);
  }
}
function setPlay(t,v){
  const k=(t==='A'?'play':'playB'), b=$('tPlay'+(t==='A'?'':'B'));
  ST[k]=v; ACC[t]=null;
  if(b){ b.textContent=v?'❚❚':'▶'; b.classList.toggle('on',v); }
  if(v)startLoop();
  else if(!ST.play&&!ST.playB&&!ST.view.spin) refresh();   /* 暗停後補一次精繪 */
}
function startLoop(){ if(raf)return; lastT=0; raf=requestAnimationFrame(loop); }
function loop(t){
  if(!ST.play&&!ST.playB&&!ST.view.spin){raf=null;return;}
  if(!lastT)lastT=t;
  const dt=Math.min((t-lastT)/1000,0.2); lastT=t;
  if(ST.view.spin) ST.view.lon=n180(ST.view.lon+dt*7);
  let moved=false;
  if(ST.play){ stepJD('A',dt*ST.speed/86400); applySync(); moved=true; }
  if(ST.playB&&!ST.syncB){ stepJD('B',dt*ST.speedB/86400); moved=true; }
  if(moved){ syncForm(); refresh({q:'low',noHash:1}); }
  else drawGlobeOnly('low');
  raf=requestAnimationFrame(loop);
}
/* ---------- 情境 ---------- */
const SCEN=[
 ['北半球 vs 南半球：月亮上下顛倒','N vs S hemisphere: the Moon is flipped','臺北','雪梨',true],
 ['赤道「船形月」vs 高緯','Equator "boat moon" vs high latitude','基多（赤道）','雷克雅維克',true],
 ['美國東西岸','US east vs west coast','紐約','舊金山',true],
 ['中國東西兩端','China: far west vs east','烏魯木齊','上海',true],
 ['東西半球：一地白天、一地夜晚','Opposite sides: day vs night','倫敦','洛杉磯',true],
 ['極區：整天不落 / 整天不升','Polar: up all day / down all day','朗伊爾城','南極點',true],
 ['同地不同時：B 晚 6 小時','Same place, B is 6 hours later','臺北','臺北',false]];
function nextScenario(){
  const s=SCEN[ST.scen%SCEN.length]; ST.scen++;
  const ia=cityIndex(s[2]), ib=cityIndex(s[3]);
  const set=(v,i)=>{const c=CITIES[i];v.name=i;v.lat=c[2];v.lon=c[3];v.tz=c[4];v.off='auto';};
  set(ST.A,ia); set(ST.B,ib); ST.syncB=s[4];
  if(!s[4]) setFromJD(ST.B,jdOf(ST.A)+0.25); else applySync();
  ST.view.lat=(ST.A.lat+ST.B.lat)/2; ST.view.lon=ST.A.lon; ST.view.zoom=0.95;
  syncForm(); fitLayout(); refresh(); toast(ST.lang==='en'?s[1]:s[0]);
}
/* ---------- 分享 ---------- */
let hashT=null;
const queueHash=()=>{clearTimeout(hashT);hashT=setTimeout(writeHash,420);};
function writeHash(){
  const enc=v=>[v.lat.toFixed(4),v.lon.toFixed(4),v.off,v.tz||'',v.name==null?-1:v.name].join('~');
  const tm=v=>[v.y,v.mo,v.d,v.h,v.mi,Math.round(v.s)].join('~');
  const p=new URLSearchParams();
  p.set('a',enc(ST.A)); p.set('ta',tm(ST.A));
  p.set('b',enc(ST.B)); p.set('tb',tm(ST.B));
  p.set('sy',ST.syncB?'1':'0'); p.set('st',ST.stats?'1':'0'); p.set('lg',ST.lang);
  try{history.replaceState(null,'','#'+p.toString());}catch(e){}
}
function readHash(){
  if(!location.hash||location.hash.length<4)return false;
  try{
    const p=new URLSearchParams(location.hash.slice(1));
    const dec=(v,k,tk)=>{
      const a=(p.get(k)||'').split('~'); if(a.length<5)return false;
      v.lat=clamp(parseFloat(a[0]),-90,90); v.lon=n180(parseFloat(a[1]));
      v.off=a[2]==='auto'?'auto':(parseFloat(a[2])||0); v.tz=a[3]||null; v.name=parseInt(a[4],10);
      if(isNaN(v.name)||v.name<0||v.name>=CITIES.length)v.name=-1;
      const t=(p.get(tk)||'').split('~').map(Number);
      if(t.length===6&&t.every(x=>!isNaN(x))){v.y=t[0];v.mo=t[1];v.d=t[2];v.h=t[3];v.mi=t[4];v.s=t[5];}
      return true;
    };
    if(!dec(ST.A,'a','ta'))return false;
    dec(ST.B,'b','tb');
    ST.syncB=p.get('sy')!=='0';
    if(p.get('st')!==null) ST.stats=p.get('st')!=='0';
    if(p.get('lg')==='en')ST.lang='en';
    return true;
  }catch(e){return false;}
}
function share(){
  writeHash();
  const url=location.href, done=()=>toast(T.copied);
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(done).catch(()=>fb());
  else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);
    ta.select(); try{document.execCommand('copy');done();}catch(e){toast(T.copyFail);}
    document.body.removeChild(ta);}
}
let toastT=null;
function toast(m){const e=$('toast');e.textContent=m;e.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2400);}
/* ---------- 語言 ---------- */
function setLang(l){
  ST.lang=l; T=I18N[l];
  root.lang=(l==='en'?'en':'zh-Hant');
  document.querySelectorAll('[data-t]').forEach(e=>{const k=e.dataset.t;if(T[k]!==undefined)e.textContent=T[k];});
  $('btnLang').textContent=(l==='zh'?'EN':'中文');
  $('notes').innerHTML=T.notesHtml;
  fillCountries(); fillOffsets(); syncForm(); setStats(ST.stats); fitLayout(); sizeAll(); refresh();
}
/* ---------- 自我驗算（?test） ---------- */
function mvTest(){
  const out=[],ok=(n,got,exp,tol)=>{const d=Math.abs(got-exp);
    out.push({name:n,got:+got.toFixed(6),exp,diff:+d.toFixed(6),pass:d<=tol});};
  const T92=(2448724.5-2451545)/36525;
  const mn=moonPos(T92,{dpsi:0,deps:0});
  ok('Meeus 47.a lon',mn.gLon,133.162655,0.0008);
  ok('Meeus 47.a lat',mn.lat,-3.229126,0.0008);
  ok('Meeus 47.a dist',mn.r,368409.7,1.2);
  const sc=buildScene(2448724.5-deltaT(1992,4)/86400);
  const c=unit(mul(sc.moonEq,-1));
  ok('Meeus 53.a lib lon',atan2(dot(c,sc.yb),dot(c,sc.xb))*R2D,-1.206,0.02);
  ok('Meeus 53.a lib lat',asin(clamp(dot(c,sc.zb),-1,1))*R2D,4.194,0.02);
  const T87=(2446896.5-2451545)/36525,n87=nutation(T87);
  ok('Meeus 22.a dpsi" (4-term)',n87.dpsi*3600,-3.788,0.5);
  ok('Meeus 22.a deps" (4-term)',n87.deps*3600,9.443,0.5);
  ok('Meeus 22.a eps0',meanObliq(T87),23+26/60+27.407/3600,0.00002);
  const T25=(2448908.5-2451545)/36525,n25=nutation(T25),su=sunPos(T25,n25);
  ok('Meeus 25.a sun lon',su.lon,199.90895,0.002);
  ok('Meeus 25.a sun R (low-acc)',su.au,0.99760775,0.0002);
  const nm=buildScene(jdFromUTC(2000,1,6,18,14,0)-deltaT(2000,1)/86400);
  ok('new moon 2000-01-06 elong',n180(nm.elongEcl),0,0.35);
  console.table(out);
  return {pass:out.every(o=>o.pass),out};
}
window.mvTest=mvTest;
/* ---------- 啟動 ---------- */
function init(){
  MIP.earth =buildMips(TEX.earth ,3,192);
  MIP.lights=buildMips(TEX.lights,1,192);
  MIP.bump  =buildMips(TEX.bump  ,1,192);
  MIP.water =buildMips(TEX.water ,1,192);
  for(const k of ['earth','lights','bump','water']) delete TEX[k].d;
  GE.aniso=(navigator.hardwareConcurrency||2)<=2?1:2;
  initWorkers();
  setFromJD(ST.A,Date.now()/86400000+2440587.5); applySync();
  readHash();
  T=I18N[ST.lang];
  fillCountries(); fillOffsets(); bindForm(); globeSetup();
  moonSetup('A'); moonSetup('B'); setTarget('A');
  setLang(ST.lang);
  fitLayout(); sizeAll(); refresh();
  let rt=null;
  const ro=new ResizeObserver(()=>{clearTimeout(rt);rt=setTimeout(()=>{fitLayout();sizeAll();drawAll();},80);});
  ro.observe($('main')); ro.observe($('gpane'));
  addEventListener('scroll',dropAvoid,true);
  addEventListener('orientationchange',()=>setTimeout(()=>{fitLayout();sizeAll();drawAll();},280));
  $('loader').classList.add('gone');
  setTimeout(()=>{const l=$('loader');if(l)l.remove();},550);
  setTimeout(()=>{ if(GE.ready&&scene){sizeAll();drawGlobeOnly();} updateText(); },1700);
  if(/(\?|&)test/.test(location.search)) setTimeout(()=>console.log(mvTest()),120);
}
Promise.all([loadTex(ASSETS.earth,'earth'),loadTex(ASSETS.lights,'lights'),
             loadTex(ASSETS.bump,'bump'),loadTex(ASSETS.water,'water'),
             loadTex(ASSETS.moon,'moon')])
  .then(init)
  .catch(e=>{$('ldtxt').textContent='貼圖載入失敗 / texture load failed: '+e.message;});
